name: Steam historical capture

on:
  workflow_dispatch:
  schedule:
    # Cada hora, al minuto 17 UTC. Evita el pico exacto de :00.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: steam-historical-capture
  cancel-in-progress: false

jobs:
  capture-and-upload:
    name: Capture Steam and upload to Azure
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CAPTURE_LIMIT: "0"
      GAME_MANIFEST_PATH: "steam_games_manifest.json"
      CAPTURE_OUTPUT_DIR: "captures"

      HIST_WORKERS: "8"
      STORE_DOMAIN_INTERVAL_SECONDS: "0.35"
      PLAYERS_INTERVAL_SECONDS: "0.05"
      DEFERRED_RETRY_WAIT_SECONDS: "20"
      DEFERRED_STORE_DOMAIN_INTERVAL_SECONDS: "0.85"
      DEFERRED_PLAYERS_INTERVAL_SECONDS: "0.20"
      DEFERRED_MAX_ATTEMPTS: "3"

      REPAIR_STORE_INTERVAL_SECONDS: "2.0"
      REPAIR_MAX_ATTEMPTS: "4"

      AZURE_PGPORT: "5432"
      AZURE_PGSSLMODE: "require"
      AZURE_DB_CONNECT_ATTEMPTS: "30"
      AZURE_DB_CONNECT_WAIT_SECONDS: "10"

      AZURE_PGHOST: ${{ secrets.AZURE_PGHOST }}
      AZURE_PGDATABASE: ${{ secrets.AZURE_PGDATABASE }}
      AZURE_PGUSER: ${{ secrets.AZURE_PGUSER }}
      AZURE_PGPASSWORD: ${{ secrets.AZURE_PGPASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-history.txt

      - name: Install Python dependencies
        run: pip install -r requirements-history.txt

      # ----------------------------------------------------------
      # Azure PostgreSQL permanece APAGADO durante captura + repair.
      # ----------------------------------------------------------
      - name: Capture Steam to staged SQLite
        run: python 44_steam_historical_capture_v4_staged.py

      - name: Locate staged capture
        shell: bash
        run: |
          set -euo pipefail
          STAGED_FILE="$(ls -1t captures/*.sqlite | head -n 1)"
          test -n "$STAGED_FILE"
          echo "STAGED_FILE=$STAGED_FILE" >> "$GITHUB_ENV"
          echo "Staged capture located."

      - name: Repair missing Store prices
        run: python 47_repair_staged_store_failures.py "$STAGED_FILE"

      # No se enciende Azure si el lote staged sigue incompleto.
      - name: Verify staged batch is complete
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sqlite3

          path = os.environ["STAGED_FILE"]
          db = sqlite3.connect(path)
          try:
              row = db.execute(
                  """
                  SELECT expected_games, captured_games, error_games, status
                  FROM capture_batch
                  LIMIT 1
                  """
              ).fetchone()
          finally:
              db.close()

          if row is None:
              raise SystemExit("capture_batch no existe en el staged SQLite.")

          expected, captured, errors, status = row
          print(
              f"Staged batch: expected={expected}, captured={captured}, "
              f"errors={errors}, status={status}"
          )

          if status != "SUCCESS" or int(errors) != 0 or int(captured) != int(expected):
              raise SystemExit(
                  "El lote staged no esta completo. Azure permanecera apagado."
              )
          PY

      # ----------------------------------------------------------
      # Desde aqui se necesita Azure.
      # GitHub NO usa OIDC ni Azure CLI: llama al webhook privado
      # de Azure Automation y le pasa solo la IP de este runner.
      # ----------------------------------------------------------
      - name: Get GitHub runner public IP
        id: runner_ip
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl --fail --silent --show-error https://api.ipify.org)"
          test -n "$RUNNER_IP"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "Runner public IP obtained."

      - name: Request Azure PostgreSQL START
        shell: bash
        env:
          START_WEBHOOK: ${{ secrets.AZURE_START_WEBHOOK_URL }}
          RUNNER_IP: ${{ steps.runner_ip.outputs.runner_ip }}
        run: |
          set -euo pipefail
          test -n "$START_WEBHOOK"
          test -n "$RUNNER_IP"

          PAYLOAD="$(printf '{\"runner_ip\":\"%s\"}' "$RUNNER_IP")"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$START_WEBHOOK" \
            -o /tmp/azure-start-response.json

          echo "Azure Automation START webhook accepted."

      # Este script espera la senal REAL: PostgreSQL responde y la
      # regla temporal de firewall ya permite a este runner conectarse.
      - name: Wait for Azure PostgreSQL access
        run: python 48_wait_for_azure_postgres.py

      - name: Upload staged batch to Azure
        run: python 45_upload_staged_capture_to_azure.py "$STAGED_FILE"

      - name: Validate uploaded batch
        run: python 49_validate_uploaded_batch.py "$STAGED_FILE"

      # Conserva SQLite solo cuando algo falla para poder diagnosticar
      # o recuperar el lote sin repetir la captura completa.
      - name: Preserve staged capture on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-steam-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: captures/*.sqlite
          if-no-files-found: ignore
          retention-days: 2

  cleanup:
    name: Always request Azure shutdown
    needs: capture-and-upload
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # Idempotente: si START nunca ocurrio, el runbook ve Stopped y termina.
      # Si START ocurrio, elimina gha-runner-temp y solicita STOP.
      - name: Request firewall cleanup and PostgreSQL STOP
        shell: bash
        env:
          STOP_WEBHOOK: ${{ secrets.AZURE_STOP_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$STOP_WEBHOOK"

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$STOP_WEBHOOK" \
            -o /tmp/azure-stop-response.json

          echo "Azure Automation STOP webhook accepted."
